<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!--
    The hero's light source, produced as an asset rather than assembled from
    flat CSS ramps. This business has no photographs and stock imagery was
    refused, so the first viewport is lit instead of shot: a single amber
    worklamp thrown across a graphite floor, which is what the unit looks like
    at eight in the evening with the door up.

    Falloff is authored across seven stops so the pool has a hot core, a long
    shoulder and a real edge. Grain is baked in over the top, both to kill
    banding on wide dark gradients and to give the light something to sit in.
  -->
  <defs>
    <radialGradient id="pool" cx="0.24" cy="0.3" r="0.62">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.46"/>
      <stop offset="0.14" stop-color="#ffa724" stop-opacity="0.32"/>
      <stop offset="0.3" stop-color="#f59a1f" stop-opacity="0.185"/>
      <stop offset="0.46" stop-color="#d97f18" stop-opacity="0.1"/>
      <stop offset="0.63" stop-color="#a85f12" stop-opacity="0.05"/>
      <stop offset="0.82" stop-color="#6b3d0c" stop-opacity="0.018"/>
      <stop offset="1" stop-color="#3a2106" stop-opacity="0"/>
    </radialGradient>

    <!-- The throw along the floor, where the beam runs out flat. -->
    <linearGradient id="floor" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffa724" stop-opacity="0.115"/>
      <stop offset="0.24" stop-color="#e08c1c" stop-opacity="0.055"/>
      <stop offset="0.55" stop-color="#8a5210" stop-opacity="0.014"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <!-- A soft spill high on the left, where the lamp itself hangs. -->
    <radialGradient id="spill" cx="0.13" cy="0.05" r="0.42">
      <stop offset="0" stop-color="#ffc978" stop-opacity="0.2"/>
      <stop offset="0.42" stop-color="#e0912a" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#pool)"/>
  <rect y="520" width="1600" height="480" fill="url(#floor)"/>
  <rect width="1600" height="1000" fill="url(#spill)"/>
  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.055" style="mix-blend-mode:overlay"/>
</svg>
